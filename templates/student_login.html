{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4">
            <div class="text-center mb-4">
                <i class="fas fa-sign-in-alt fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Login to access your library account</p>
            </div>

            <form method="POST" action="{{ url_for('student_login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0 bg-light" id="email" name="email"
                            required placeholder="student@university.edu">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password"
                            name="password" required placeholder="Your password">
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">Login</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">Don't have an account? <a href="{{ url_for('student_register') }}"
                        class="text-primary text-decoration-none fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
