{% extends "utils/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 border-0 shadow-sm rounded">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-muted">Join the university library system</p>
            </div>

            <form method="POST" action="{{ url_for('student_register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label text-secondary fw-semibold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0 bg-light" id="name" name="name"
                            required placeholder="John Doe">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-secondary fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0 bg-light" id="email" name="email"
                            required placeholder="student@university.edu">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password"
                            name="password" required placeholder="Create a strong password">
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-block rounded-pill">Register</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted">Already have an account? <a href="{{ url_for('student_login') }}"
                        class="text-primary text-decoration-none fw-semibold">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
